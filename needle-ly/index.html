<style>
/* Layout concept: a studio bench. Tool rail, a ruled canvas in the middle, thread tray on the right. */
:root{
  --bg:#E8ECEA; --panel:#F5F7F6; --panel2:#ECF0EE; --ink:#18202C; --mute:#5C6879; --line:#C9D1CE;
  --accent:#2446D4; --accent-ink:#FFFFFF; --accent-soft:#DDE4FB; --fabric:#F3F1E8; --stage:#DCE2DF;
  --ok:#1F8A4D; --warn:#B4531A; --gridl:rgba(24,32,44,.16); --gridb:rgba(24,32,44,.55);
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141B; --panel:#1A212B; --panel2:#222A36; --ink:#E8ECF2; --mute:#97A3B5; --line:#2D3746;
  --accent:#8CA0FF; --accent-ink:#0C1233; --accent-soft:#27315E; --fabric:#2B313A; --stage:#0D1117;
  --ok:#5BD08B; --warn:#F0A06A; --gridl:rgba(232,236,242,.14); --gridb:rgba(232,236,242,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141B; --panel:#1A212B; --panel2:#222A36; --ink:#E8ECF2; --mute:#97A3B5; --line:#2D3746;
  --accent:#8CA0FF; --accent-ink:#0C1233; --accent-soft:#27315E; --fabric:#2B313A; --stage:#0D1117;
  --ok:#5BD08B; --warn:#F0A06A; --gridl:rgba(232,236,242,.14); --gridb:rgba(232,236,242,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;padding-top:8px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand svg{width:26px;height:26px;color:var(--accent)}
#pname{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;min-width:0;width:200px;max-width:100%;font-weight:600}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--panel)}
.tabs{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:9px;border:1px solid var(--line);overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:500;color:var(--mute);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.grow{flex:1}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:16px}
.ib:disabled{opacity:.4;cursor:default}
.ib svg{width:18px;height:18px}
#main{display:grid;grid-template-columns:auto minmax(0,1fr) 310px;grid-template-areas:"tools stage side";gap:8px;min-height:0;padding-bottom:8px}
#tools{grid-area:tools;display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#stage,#exportStage,#projStage{grid-area:stage;min-width:0;min-height:0;position:relative;background:var(--stage);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#side{grid-area:side;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:14px;min-width:0}
#main[data-v="projects"]{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage"}
#main[data-v="projects"] #side,#main[data-v="projects"] #tools{display:none}
#main[data-v="export"] #tools{display:none}
#main[data-v="export"]{grid-template-columns:minmax(0,1fr) 330px;grid-template-areas:"stage side"}
#main[data-v="stitch"] #tools,#main[data-v="preview"] #tools{display:none}
#main[data-v="stitch"],#main[data-v="preview"]{grid-template-columns:minmax(0,1fr) 310px;grid-template-areas:"stage side"}
.tb{width:38px;height:38px;border:1px solid transparent;border-radius:8px;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.tb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb:hover{background:var(--panel2)}
.tb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sep{height:1px;background:var(--line);margin:3px 0;flex:none}
#viewbar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;max-width:calc(100% - 20px);flex-wrap:wrap}
#viewbar input[type=range]{width:110px}
#viewbar button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:3px 9px}
#info:empty{display:none}
#info{position:absolute;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font:12px var(--f-mono);max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pn{min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover,.seg button:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:12px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--mute);font-weight:500}
.field.row{flex-direction:row;align-items:center;justify-content:space-between;gap:8px}
input[type=text],input[type=number],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
input[type=number]{font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.threads{display:flex;flex-direction:column;gap:3px;max-height:340px;overflow-y:auto}
.th{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 6px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.th:hover{background:var(--panel2)}
.th[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sw{width:30px;height:26px;border-radius:5px;display:grid;place-items:center;font:600 13px var(--f-mono);border:1px solid rgba(0,0,0,.25)}
.th .nm{min-width:0;line-height:1.15}
.th .nm b{font:500 12px var(--f-mono);display:block}
.th .nm span{font-size:11px;color:var(--mute);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .ct{font:11px var(--f-mono);color:var(--mute);text-align:right}
.th .ac{display:flex;gap:2px;margin-top:2px;justify-content:flex-end}
.th .ac button{border:0;background:none;color:var(--mute);padding:0 3px;font-size:13px}
.th .ac button:hover{color:var(--accent)}
.bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.big{font:800 34px var(--f-display);letter-spacing:-.02em}
.mute{color:var(--mute)}
.mono{font-family:var(--f-mono)}
.small{font-size:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv span:nth-child(odd){color:var(--mute)}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right}
/* export */
#exportStage{display:flex;flex-direction:column}
#exportStage .pgwrap{flex:1;min-height:0;overflow:auto;padding:14px;display:grid;place-items:start center}
#pg{width:100%;max-width:860px;height:auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.25);display:block}
.pgnav{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
/* projects */
#projStage{overflow:auto;padding:16px;background:var(--bg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pc[aria-current="true"]{border-color:var(--accent)}
.pc canvas{width:100%;height:150px;object-fit:contain;background:var(--fabric);display:block}
.pc .in{padding:10px;display:flex;flex-direction:column;gap:6px}
.pc h3{font-size:15px}
.pc .btns{margin-top:2px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.55);display:grid;place-items:center;z-index:50;padding:12px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dlg.wide{width:min(960px,100%)}
.dlg>header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg h2{font-size:18px}
.dlg .x{border:0;background:none;font-size:18px;color:var(--mute)}
.dbody{padding:14px 16px;overflow:auto;min-height:0}
.dfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.wiz{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.wiz canvas{width:100%;background:var(--fabric);border:1px solid var(--line);border-radius:8px;image-rendering:pixelated;display:block}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:340px;overflow:auto;margin-top:8px}
.sgrid button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px}
.sgrid button:hover{border-color:var(--accent)}
.sgrid .sw{height:24px}
.sgrid small{display:block;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anchor{display:grid;grid-template-columns:repeat(3,28px);gap:3px}
.anchor button{height:28px;border:1px solid var(--line);background:var(--panel2);border-radius:5px}
.anchor button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:80;font-size:13px;max-width:90vw}
#toast[hidden]{display:none}
@media (max-width:900px){
  body{overflow:auto}
  #app{height:auto;min-height:100%;display:flex;flex-direction:column}
  #main,#main[data-v]{display:flex;flex-direction:column;grid-template-columns:none}
  #tools{flex-direction:row;flex-wrap:wrap;overflow:visible;order:0}
  #stage,#exportStage{height:62vh;min-height:320px;flex:none;order:1}
  #side{order:2;overflow:visible}
  #projStage{min-height:70vh}
  .wiz{grid-template-columns:1fr}
  #pname{width:140px}
}
#cv{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{overscroll-behavior:none}
#viewbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (pointer:coarse){.tb{width:46px;height:46px}.ib{width:44px;height:44px}#viewbar button{min-height:40px;min-width:40px}#viewbar input[type=range]{height:32px;width:140px}.btn,.seg button{min-height:40px}.th{padding:8px 6px}.sw{height:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function detectBlock(src){const w=src.naturalWidth||src.width,h=src.naturalHeight||src.height;if(w*h>4e6)return 1;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0);const d=x.getImageData(0,0,w,h).data,gcd=(a,b)=>b?gcd(b,a%b):a,same=(i,j)=>d[i]===d[j]&&d[i+1]===d[j+1]&&d[i+2]===d[j+2]&&d[i+3]===d[j+3];let g=0;
  for(let y=0;y<h&&g!==1;y++){let run=1;for(let X=1;X<=w;X++){if(X<w&&same((y*w+X)*4,(y*w+X-1)*4))run++;else{g=gcd(g,run);run=1;if(g===1)break}}}
  for(let X=0;X<w&&g!==1;X++){let run=1;for(let y=1;y<=h;y++){if(y<h&&same((y*w+X)*4,((y-1)*w+X)*4))run++;else{g=gcd(g,run);run=1;if(g===1)break}}}
  return g||1}
function openWizard(src,name){

  <div class="pair"><div class="field"><label>Brightness</label><input type="range" id="wzBr" min="-50" max="50" value="0"></div><div class="field"><label>Contrast</label><input type="range" id="wzCo" min="-50" max="50" value="0"></div></div>

  <div class="pn"><h3>Include</h3>${[['cover','Cover page with preview'],['key','Thread key and estimates'],['map','Chart map of the sheets']].map(([k,l])=>`<label class="small" style="display:flex;gap:6px;margin-bottom:4px"><input type="checkbox" data-k="x:inc" data-n="${k}" ${EO[k]?'checked':''}> ${l}</label>`).join('')}</div>
  <div class="pn"><h3>Designer details</h3><div class="field"><label>Designer name</label><input type="text" data-k="x:designer" value="${esc(m.designer)}"></div><div class="field"><label>Shop or website</label><input type="text" data-k="x:shop" value="${esc(m.shop)}"></div><div class="field"><label>Copyright line</label><input type="text" data-k="x:copy" value="${esc(m.copy)}" placeholder="© 2026 Your name. For personal use."></div>
  <div class="field"><label>Prepared for (personalised copy)</label><input type="text" data-k="x:customer" value="${esc(m.customer)}" placeholder="Customer name or date"></div><div class="field"><label>Notes on the cover</label><textarea rows="3" data-k="x:notes">${esc(m.notes)}</textarea></div>
  <div class="btns"><button class="btn sm" data-a="x:logo">${m.logo?'Replace logo':'Add shop logo'}</button>${m.logo?'<button class="btn sm danger" data-a="x:rmlogo">Remove logo</button>':''}</div></div>
  <div class="pn"><h3>Thread estimates</h3><div class="pair"><div class="field"><label>Strands</label><input type="number" min="1" max="12" data-k="x:strands" value="${P.strands}"></div><div class="field"><label>Waste %</label><input type="number" min="0" max="100" data-k="x:waste" value="${P.waste}"></div></div></div>
  <div class="pn"><h3>Save</h3><div class="btns"><button class="btn pri" data-a="x:pdf">Download PDF</button><button class="btn" data-a="x:jpg">This page as JPG</button><button class="btn" data-a="x:png">Whole chart as PNG</button><button class="btn" data-a="x:file">Save project file</button></div><label class="small" style="display:flex;gap:6px;margin-top:8px"><input type="checkbox" data-k="x:embed" ${EO.embed?'checked':''}> Include the editable project inside the PDF so I can reopen it later</label><p class="small mute" id="xmsg" style="margin:6px 0 0"></p></div>`}
let DL=null;
async function saveFile(name,data){if(!DL){toast('Saving files is not available in this view.');return false}try{await DL.save({filename:name,data});toast('Saved '+name);return true}catch(e){if(!(e&&e.code==='declined'))toast(e&&e.message?e.message:'Could not save the file.');return false}}
const fname=ext=>(P.name.replace(/[^\w\- ]+/g,'').trim()||'needlely').slice(0,60)+ext;
const toBlob=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));
function makePDF(jp,W,H,emb){const parts=[],offs=[];let len=0;const enc=new TextEncoder(),push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  push('%PDF-1.4\n');const n=jp.length,on=i=>3+i*3;offs[1]=len;push(`1 0 obj\n<</Type/Catalog/Pages 2 0 R${emb?`/NLData ${3+n*3} 0 R`:''}>>\nendobj\n`);
  offs[2]=len;push(`2 0 obj\n<</Type/Pages/Count ${n}/Kids [${jp.map((_,i)=>`${on(i)+2} 0 R`).join(' ')}]>>\nendobj\n`);
  jp.forEach((j,i)=>{const o=on(i);offs[o]=len;push(`${o} 0 obj\n<</Type/XObject/Subtype/Image/Width ${j.w}/Height ${j.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${j.bytes.length}>>\nstream\n`);push(j.bytes);push('\nendstream\nendobj\n');
    const c=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;offs[o+1]=len;push(`${o+1} 0 obj\n<</Length ${c.length}>>\nstream\n${c}\nendstream\nendobj\n`);
    offs[o+2]=len;push(`${o+2} 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox [0 0 ${W} ${H}]/Resources<</XObject<</Im0 ${o} 0 R>>>>/Contents ${o+1} 0 R>>\nendobj\n`)});
  if(emb){offs[3+n*3]=len;push(`${3+n*3} 0 obj\n<</NLPROJ 1/Length ${emb.length}>>\nstream\n${emb}\nendstream\nendobj\n`)}
  const total=3+n*3+(emb?1:0),xr=len;push(`xref\n0 ${total}\n0000000000 65535 f \n`);for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<</Size ${total}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);const out=new Uint8Array(len);let p=0;parts.forEach(b=>{out.set(b,p);p+=b.length});return out}
const EXP={
  paper(t){EO.paper=t.dataset.v;EO.page=0;renderExport()},cell(t){EO.cell=+t.dataset.v;EO.page=0;renderExport()},style(t){EO.style=t.dataset.v;renderExport()},
  prev(){EO.page--;renderPageOnly()},next(){EO.page++;renderPageOnly()},
  logo(){$('#fLogo').value='';$('#fLogo').click()},rmlogo(){P.meta.logo=null;scheduleSave();renderExport()},
  async pdf(){const{W,H,pw,ph}=pageDims(),B=buildPages(),jp=[],c=document.createElement('canvas'),msg=$('#xmsg');
    for(let i=0;i<B.pg.length;i++){msg.textContent=`Rendering page ${i+1} of ${B.pg.length}…`;await new Promise(r=>setTimeout(r,0));renderPageTo(c,B.pg[i],i,B.pg.length,B);const bl=await toBlob(c,'image/jpeg',.9);jp.push({bytes:new Uint8Array(await bl.arrayBuffer()),w:W,h:H})}
    msg.textContent='';await saveFile(fname('.pdf'),new Blob([makePDF(jp,pw,ph,EO.embed?btoa(unescape(encodeURIComponent(JSON.stringify(serialize(P))))):'')],{type:'application/pdf'}))},
  async jpg(){const c=document.createElement('canvas');renderPageTo(c,EB.pg[EO.page],EO.page,EB.pg.length,EB);await saveFile(fname(`-page-${EO.page+1}.jpg`),await toBlob(c,'image/jpeg',.92))},
  async png(){const cell=Math.max(8,Math.min(24,Math.floor(9000/Math.max(P.w,P.h)))),pad=50,c=document.createElement('canvas');c.width=P.w*cell+pad*2;c.height=P.h*cell+pad*2;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    chartInner(x,{x0:0,y0:0,x1:P.w,y1:P.h},pad,pad,cell,EO.style,true);await saveFile(fname('-chart.png'),await toBlob(c,'image/png'))},
  async file(){await saveFile(fname('.needlely.json'),new Blob([JSON.stringify(serialize(P))],{type:'application/json'}))}};
function EXPK(k,t){const m=P.meta;
  if(k==='embed'){EO.embed=t.checked;return}
  if(k==='page'){EO.page=+t.value;renderPageOnly();return}
  if(k==='inc'){EO[t.dataset.n]=t.checked;EO.page=0;renderPageOnly();return}
  if(k==='strands')P.strands=clamp(+t.value||1,1,12);else if(k==='waste')P.waste=clamp(+t.value||0,0,100);else m[k]=t.value;
  scheduleSave();clearTimeout(EXPK.t);EXPK.t=setTimeout(renderPageOnly,150)}
$('#fLogo').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const s=Math.min(1,500/img.naturalWidth,300/img.naturalHeight),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);P.meta.logo=c.toDataURL('image/png');scheduleSave();renderExport()};img.onerror=()=>toast('That file could not be read as an image.');img.src=URL.createObjectURL(f)};
async function savePreviewImage(){const z=Math.max(6,Math.min(24,Math.floor(2600/Math.max(P.w,P.h)))),pad=30,c=document.createElement('canvas');c.width=P.w*z+pad*2;c.height=P.h*z+pad*2;const x=c.getContext('2d');
  x.fillStyle=FAB[V.sim.fabric]||FAB.aida;x.fillRect(0,0,c.width,c.height);const fab=FAB[V.sim.fabric]||FAB.aida,o=pOpts(fab,V.sim.style==='pix'?'cross':V.sim.style);
  for(let cy=0;cy<P.h;cy++)for(let cx=0;cx<P.w;cx++)paintCell(x,cx,cy,pad+cx*z,pad+cy*z,z,V.sim.style==='pix'?'flat':'sim',o);if(V.sim.bs)paintExtras(x,pad,pad,z,{outline:false,hl:-1});
  await saveFile(fname('-preview.png'),await toBlob(c,'image/png'))}

/* ================= projects ================= */
function drawThumb(c,p){const W=c.width=420,Hh=c.height=300,x=c.getContext('2d');x.fillStyle=css('--fabric');x.fillRect(0,0,W,Hh);const z=Math.min((W-16)/p.w,(Hh-16)/p.h),ox=(W-p.w*z)/2,oy=(Hh-p.h*z)/2;
  for(let i=0;i<p.cells.length;i++){const id=p.cells[i];if(id&&p.pal[id-1]){x.fillStyle=p.pal[id-1].hex;x.fillRect(ox+(i%p.w)*z,oy+Math.floor(i/p.w)*z,z+.5,z+.5)}}}
function renderProjects(){const st=$('#projStage'),ids=loadIndex();if(P&&!ids.includes(P.id)){saveProject(P);ids.unshift(P.id)}
  const list=ids.map(id=>id===P.id?P:loadProject(id)).filter(Boolean);
  st.innerHTML=`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><h1 style="font-size:28px">Projects</h1><div class="grow"></div><button class="btn pri" data-p="new">New blank canvas</button><button class="btn" data-p="photo">From a photo or pixel art</button><button class="btn" data-p="open">Open project or Needle-ly PDF</button></div>
  <div class="pgrid">${list.map(p=>{let t=0,d=0;for(let i=0;i<p.cells.length;i++)if(p.cells[i]||p.frac[i]){t++;if(p.done[i])d++}const pc=t?Math.round(d/t*100):0;
    return`<article class="pc" data-id="${p.id}" aria-current="${p.id===P.id}"><canvas data-th="${p.id}"></canvas><div class="in"><h3>${esc(p.name)}</h3><div class="small mute mono">${p.w}×${p.h} · ${p.count} ct · ${p.pal.length} threads</div><div class="bar"><i style="width:${pc}%"></i></div><div class="small mute">${pc}% stitched · edited ${new Date(p.updated).toLocaleDateString()}</div>
    <div class="btns"><button class="btn sm pri" data-p="load" data-id="${p.id}">${p.id===P.id?'Continue':'Open'}</button><button class="btn sm" data-p="dup" data-id="${p.id}">Duplicate</button><button class="btn sm danger" data-p="del" data-id="${p.id}">${V.delId===p.id?'Tap again to delete':'Delete'}</button></div></div></article>`}).join('')}</div>
  <p class="small mute" style="margin-top:16px">Projects are kept in this browser and saved as you work. Use Export → Save project file for a backup you can move to another device.</p>`;
  list.forEach(p=>{const c=st.querySelector(`[data-th="${p.id}"]`);if(c)drawThumb(c,p)})}
$('#projStage').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const a=b.dataset.p,id=b.dataset.id;
  if(a==='new')openNew();else if(a==='photo'){$('#fPhoto').value='';$('#fPhoto').click()}else if(a==='open'){$('#fProj').value='';$('#fProj').click()}
  else if(a==='load'){if(id!==P.id){saveProject(P);const p=loadProject(id);if(p)openProject(p)}setTab('design')}
  else if(a==='dup'){const src=id===P.id?P:loadProject(id),o=serialize(src);o.id=uid();o.name=src.name+' copy';const p=deserialize(o);saveProject(p);renderProjects();toast('Duplicated')}
  else if(a==='del'){if(V.delId!==id){V.delId=id;renderProjects();setTimeout(()=>{V.delId=null;if(V.tab==='projects')renderProjects()},4000);return}V.delId=null;deleteProject(id);
    if(id===P.id){const rest=loadIndex();const p=rest.length?loadProject(rest[0]):makeBlank();openProject(p)}renderProjects()}});
$('#fProj').onchange=e=>{const f=e.target.files[0];if(!f)return;const pdf=/\.pdf$/i.test(f.name)||f.type==='application/pdf',r=new FileReader();
  r.onload=()=>{try{let o;if(pdf){const t=new TextDecoder('latin1').decode(new Uint8Array(r.result)),k=t.indexOf('/NLPROJ 1/Length');
      if(k<0){toast('This PDF has no editable project inside. Only PDFs exported from Needle-ly with "Include the editable project" ticked can be reopened.');return}
      const a=t.indexOf('stream\n',k)+7,b=t.indexOf('\nendstream',a);o=JSON.parse(decodeURIComponent(escape(atob(t.slice(a,b)))))}else o=JSON.parse(r.result);
    if(!o.w||!o.h||o.cells==null)throw 0;o.id=uid();const p=deserialize(o);saveProject(P);openProject(p);setTab('design');toast('Opened '+p.name)}catch(_){toast('That is not a Needle-ly project file.')}};
  pdf?r.readAsArrayBuffer(f):r.readAsText(f)};
function makeBlank(){const p=newProject(60,60,14,'Untitled canvas');p.pal.push({b:'DMC',code:'310',name:'Black',hex:'#000000',sym:SYMS[0]});return p}
function openNew(){const body=modal('New blank canvas',`<div class="field"><label>Name</label><input type="text" id="nwN" value="Untitled canvas"></div><div class="pair"><div class="field"><label>Mesh / fabric count</label><select id="nwC">${COUNTS.map(c=>`<option ${c===14?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Size in</label><select id="nwU"><option value="st">Stitches</option><option value="in">Inches</option><option value="cm">Centimetres</option></select></div></div>
  <div class="pair"><div class="field"><label>Width</label><input type="number" id="nwW" value="60" min="1" step="any"></div><div class="field"><label>Height</label><input type="number" id="nwH" value="60" min="1" step="any"></div></div><p class="small mute mono" id="nwS"></p><div class="dfoot"><button class="btn" data-x>Cancel</button><button class="btn pri" id="nwOk">Create</button></div>`);
  const g=id=>$('#'+id,body),dims=()=>{const c=+g('nwC').value,u=g('nwU').value,k=u==='st'?1:u==='in'?c:c/2.54;return[clamp(Math.round(+g('nwW').value*k),5,500),clamp(Math.round(+g('nwH').value*k),5,500),c]};
  const upd=()=>{const d=dims();g('nwS').textContent=`${d[0]} × ${d[1]} stitches · ${(d[0]/d[2]).toFixed(1)} × ${(d[1]/d[2]).toFixed(1)} in`};['nwC','nwU','nwW','nwH'].forEach(i=>g(i).oninput=upd);upd();
  $('[data-x]',body).onclick=closeModal;g('nwOk').onclick=()=>{const[w,h,c]=dims(),p=newProject(w,h,c,g('nwN').value||'Untitled canvas');p.tech=c<=14?'tent':'cross';p.strands=3;saveProject(P);closeModal();openProject(p);setTab('design');pickThread((ent,b)=>{V.col=addThread(ent,b);afterChange();closeModal()},'Pick your first thread')}}
function makeSample(){const res=convertImage(sampleCanvas(),{w:72,h:54,brand:'DMC',n:14,dither:false,bri:0,con:5,sat:10,blend:false,white:false,count:14}),p=newProject(72,54,14,'Sunset Hills (sample)');p.pal=res.pal;p.cells=res.idx;p.tech='tent';p.strands=3;
  const f=c=>BRANDS.DMC.find(t=>t.code===c);
  p.meta.designer='Needle-ly sample';p.meta.copy='Sample pattern. Free to stitch and change.';
  const keep=P;P=p;const bk=addThread(f('310'),'DMC'),wh=addThread(f('White'),'DMC');P=keep;
  [[[20,15],[21.5,16],[23,15]],[[26,13],[27.5,14],[29,13]],[[11,18],[12.5,19],[14,18]]].forEach(s=>p.lines.push({a:s[0],b:s[1],c:bk},{a:s[1],b:s[2],c:bk}));
  [[6,3],[18,6],[40,4],[52,2],[63,7],[33,9],[10,10]].forEach(k=>p.knots.push({x:k[0]+.5,y:k[1]+.5,c:wh}));return p}

/* ================= project switching + init ================= */
function openProject(np){P=np;H.u=[];H.r=[];V.col=0;V.sel=null;V.paste=null;V.hl=-1;V.bsChain=null;V.drag=null;V.tracking=false;EO.page=0;saveProject(P);$('#pname').value=P.name;syncUR();fit();renderTools();renderSide();needDraw()}
function renderSide(){const s=$('#side');if(!P){s.innerHTML='';return}const f={design:sideDesign,stitch:sideStitch,preview:sidePreview,export:sideExport,projects:()=>''}[V.tab];
  const st=s.scrollTop;s.innerHTML=f();s.scrollTop=st}
function setTab(t){V.tab=t;V.drag=null;V.bsChain=null;const ex=t==='export',pj=t==='projects';$('#main').dataset.v=t;
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));$('#stage').hidden=ex||pj;$('#exportStage').hidden=!ex;$('#projStage').hidden=!pj;
  if(pj)renderProjects();else if(ex)renderExport();else{renderSide();renderTools();requestAnimationFrame(()=>{if(t==='preview')fit();needDraw()})}}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
$('#pname').addEventListener('input',e=>{if(P){P.name=e.target.value||'Untitled canvas';scheduleSave()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&P)saveProject(P)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{needDraw();if(V.tab==='export')renderPageOnly()});
wireSide();
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{DL=d;if(V.tab==='export')renderSide()},()=>{})}catch(_){}
(()=>{let p=null;const last=lsGet('nl:last',null);if(last)try{p=loadProject(last)}catch(_){}if(!p)p=makeSample();openProject(p);setTab('design');requestAnimationFrame(fit)})();
})();

</script>
