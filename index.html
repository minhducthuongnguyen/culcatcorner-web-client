<!doctype html>

<style>

body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:9px 'Press Start 2P',ui-monospace,Menlo,Consolas,monospace}

<div id="bar"><button id="mic">ENABLE MIC</button><div id="meter"><i id="lv"></i><b id="wk"></b><b id="mk"></b></div>
<label>Limit <input id="sl" type="range" min="5" max="90" value="40"></label><span id="info"></span>
<button id="tw">Test warn</button><button id="tl">Test loud</button></div>
<div id="wrap"><canvas id="c"></canvas><div id="bn"></div></div>
<script>
/*
 * LITTLE WIZARD SCHOOL - a quiet-class idle game
 * ---------------------------------------------
 * The microphone level decides what happens:
 *   calm   -> students go about school life (and special events pop up)
 *   warn   -> level near the limit: everyone freezes and drops what they hold
 *   flee   -> level above the limit: everyone runs off screen, then returns slowly
 * Layout of this file: helpers, activities, characters, noise/modes, events,
 * world + pathfinding, scenery, Horrible Harry extras, drawing, main loop.
 */
// ---- Canvas setup: the game is drawn at 320x200 and scaled up by CSS for the pixel look ----
const W = 320;
const H = 200;
const $ = i => document.getElementById(i);
const cv = $('c');
cv.width = W;
cv.height = H;
let g = cv.getContext('2d');
const bgc = document.createElement('canvas');
bgc.width = W;
bgc.height = H;
let ol = 0;
// R = draw a filled rectangle. While 'ol' is on it draws a dark 1px-bigger rectangle instead,
// which is how outlines work (see OL below).
const R = (x, y, w, h, c) => {
    if (ol) {
        g.fillStyle = '#1b1228';
        g.fillRect(Math.round(x) - 1, Math.round(y) - 1, w + 2, h + 2);
        return;
    }
    g.fillStyle = c;
    g.fillRect(Math.round(x), Math.round(y), w, h);
};
// ob = draw a 1px outline around a rectangle
const ob = (x, y, w, h, c = '#2a1a14') => {
    R(x - 1, y - 1, w + 2, 1, c);
    R(x - 1, y + h, w + 2, 1, c);
    R(x - 1, y, 1, h, c);
    R(x + w, y, 1, h, c);
};
// OL(fn) = run a drawing function twice: first as a dark silhouette, then in colour => outlined sprite
const OL = f => {
    ol = 1;
    f();
    ol = 0;
    f();
};
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
// E = draw a filled ellipse (used for shadows, ponds, canopies). Skipped during outline pass.
function E(cx, cy, rx, ry, c) {
    if (ol) {
        return;
    }
    g.fillStyle = c;
    for (let y = -ry; y <= ry; y++) {
        const w = Math.sqrt(1 - y * y / (ry * ry)) * rx;
        g.fillRect(Math.round(cx - w), Math.round(cy + y), Math.round(w * 2), 1);
    }
}
// ---- Tiny pixel emoji: each icon is 7x7 characters, letters map to the colours in PAL ----
const PAL = { r: '#e33', y: '#fd3', b: '#39f', w: '#fff', k: '#222', p: '#f6a', g: '#3a3', o: '#e92', c: '#6ef', u: '#85f' };
const IC = {
    heart: ['.......', '.rr.rr.', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'],
    star: ['...y...', '...y...', 'yyyyyyy', '.yyyyy.', '..yyy..', '.yy.yy.', '.y...y.'],
    note: ['..bbbbb', '..b...b', '..b...b', '..b...b', 'bbb.bbb', 'bbb.bbb', '.......'],
    smile: ['.yyyyy.', 'yyyyyyy', 'ykyyyky', 'yyyyyyy', 'ykyyyky', 'yykkkyy', '.yyyyy.'],
    sparkle: ['...w...', '.w.c.w.', '..ccc..', 'wcccccw', '..ccc..', '.w.c.w.', '...w...'],
    question: ['.uuuuu.', 'u.....u', '......u', '...uuu.', '...u...', '.......', '...u...'],
    excl: ['...r...', '...r...', '...r...', '...r...', '...r...', '.......', '...r...'],
    sweat: ['...b...', '..bbb..', '.bbbbb.', '.bbwbb.', '..bbb..', '.......', '.......'],
    book: ['.......', 'rrr.ooo', 'rrr.ooo', 'rrr.ooo', 'rrr.ooo', 'rrr.ooo', '.......'],
    flower: ['..ppp..', '.ppypp.', '..ppp..', '...g...', '..gg...', '...g...', '.......']
};
// Items characters carry: [colour, width, height, highlight colour]
const IT = { can: ['#4aa3ff', 3, 2, '#bfe0ff'], book: ['#c33', 3, 3, '#fff'], wand: ['#8b5a2b', 1, 4, '#ffe066'], poster: ['#ff7ab8', 3, 3, '#fff'], mask: ['#fff', 3, 3, '#222'], bread: ['#e0b070', 2, 2, '#fff'] };
const item = (k, x, y) => {
    const t = IT[k];
    R(x, y, t[1], t[2], t[0]);
    R(x + (t[1] > 2 ? 1 : 0), y, 1, 1, t[3]);
};
// Draws a speech bubble with an emoji inside
function bubble(x, y, n) {
    R(x - 1, y - 1, 9, 9, '#222');
    R(x, y, 7, 7, '#fff');
    R(x + 2, y + 8, 3, 1, '#222');
    R(x + 3, y + 9, 1, 1, '#222');
    const a = IC[n];
    for (let j = 0; j < 7; j++) {
        for (let i = 0; i < 7; i++) {
            const ch = a[j][i];
            if (ch !== '.') {
                R(x + i, y + j, 1, 1, PAL[ch]);
            }
        }
    }
}
/* ---------- activities ---------- */
// ---- ACTIVITIES ----
// Each activity has: w = how likely students pick it, it = item carried, em = emoji they may show,
// d = [min,max] seconds, sit = students sit down, s = list of [x,y] spots (one student per spot),
// o = who occupies each spot (filled in below)
const A = {
    garden: { w: 3, it: 'can', em: ['flower', 'smile', 'heart'], d: [14, 30], s: [[36, 135], [63, 135], [90, 135], [36, 159], [63, 159], [90, 159], [18, 131], [106, 150]] },
    class: { w: 2, it: 'book', em: ['book', 'question', 'star'], d: [16, 34], sit: 1, s: [[41, 57], [65, 57], [89, 57], [113, 57], [41, 75], [65, 75], [89, 75], [113, 75]] },
    lesson: { w: 2, it: 'book', em: ['book', 'smile', 'question'], d: [16, 34], sit: 1, s: [[150, 138], [165, 138], [180, 138], [195, 138], [150, 150], [165, 150], [180, 150], [195, 150]] },
    theater: { w: 3, it: 'mask', em: ['note', 'star', 'smile'], d: [14, 28], s: [[215, 50], [235, 44], [255, 50], [275, 44], [290, 52], [225, 76], [255, 78], [280, 76]] },
    deco: { w: 2, it: 'poster', em: ['star', 'heart', 'smile'], d: [10, 22], s: [[26, 40], [124, 40], [26, 64], [124, 64], [112, 34]] },
    magic: { w: 3, it: 'wand', em: ['sparkle', 'star', 'excl'], d: [12, 26], s: [[143, 52], [187, 52], [152, 72], [178, 72], [165, 38], [140, 66]] },
    pond: { w: 2, it: 'bread', em: ['heart', 'smile', 'note'], d: [10, 22], s: [[232, 140], [265, 160], [298, 140], [265, 120]] },
    read: { w: 2, it: 'book', em: ['book', 'smile', 'heart'], d: [14, 30], sit: 1, s: [[206, 121], [220, 121], [213, 128], [227, 128]] },
    ball: { w: 2, it: null, em: ['smile', 'star', 'note'], d: [12, 26], s: [[128, 181], [152, 186], [176, 181], [200, 186]] }
};
for (const k in A) {
    A[k].o = A[k].s.map(() => null);
}
// Waypoints teachers patrol between, and the post each teacher stands at (null = roams)
const WP = [[40, 100], [100, 160], [160, 98], [225, 100], [268, 100], [150, 176], [60, 100], [140, 66]];
const HOME = [[75, 37], [172, 128], [205, 70], null];
const TEM = [['book', 'excl', 'smile'], ['book', 'star', 'smile'], ['note', 'star', 'smile'], ['smile', 'flower', 'book']];
// Colour palettes for randomly generated students
const SK = ['#f6d2b0', '#e3a876', '#b9774a', '#7a4a2c'];
const HR = ['#2b1b0e', '#6b3f1d', '#d9a441', '#c0392b', '#1a1a1a', '#e8e0d0', '#7b4bd1'];
const HC = ['#c0392b', '#2e86de', '#27ae60', '#e1a400'];
const HT = ['#33264f', '#4a2c6e', '#1f3b66', '#7a2a3a'];
// ---- CHARACTERS: 40 students (cs[0..39]) followed by 4 teachers (cs[40..43]) ----
const cs = [];
for (let i = 0; i < 44; i++) {
    const tc = i >= 40;
    const hm = tc ? HOME[i - 40] : null;
    cs.push({ id: i, tc, tn: i - 40, hm, x: hm ? hm[0] : rnd(20, 300), y: hm ? hm[1] : rnd(93, 102), tx: 0, ty: 0, s: tc ? 'act' : 'idle', w: rnd(0, 3), ph: rnd(0, 6), sk: pick(SK), hr: pick(HR), hc: pick(HT), rb: tc ? ['#6a3fb5', '#1f7a8c', '#8c2f5e', '#a35a1f'][i - 40] : pick(HC), ht: Math.random() < .5, em: null, item: null, act: null, sp: 0, last: null, then: 'idle', ex: 0, ey: 0, ret: 0, frz: 0, ec: rnd(1, 3), via: null, jx: 0 });
}
/* Special characters from the Horrible Harry books (names are drawn under their feet) */
Object.assign(cs[0], { name: 'Harry', hr: '#111', ht: false, rb: '#1a1a24' });
Object.assign(cs[1], { name: 'Doug', hr: '#6b3f1d', ht: false, rb: '#2e86de', gl: true });
Object.assign(cs[2], { name: 'Song Lee', hr: '#111', ht: false, rb: '#ff7ab8' });
cs[40].name = 'Miss Mackle';
// Show an emoji bubble above a character for t seconds
const setEm = (c, i, t = 1.8) => {
    c.em = { i, t, m: t };
};
const inside = (x, y) => x > 20 && x < 130 && y < 84;
// Send a character to (x,y). A route around walls is found first (see findPath), then 'then' says what to do on arrival
function setT(c, x, y, then) {
    // If the requested spot is inside a wall/object, move the target to the nearest walkable cell
    if (BK[Math.floor(y / 4) * GW + Math.floor(x / 4)]) {
        const [ci, cj] = cOf(x, y);
        x = ci * 4 + 2;
        y = cj * 4 + 2;
    }
    c.tx = x;
    c.ty = y;
    c.then = then;
    c.s = 'go';
    c.path = findPath(c.x, c.y, x, y);
}
// Move one step along the planned route. Returns true when the final target is reached
function mv(c, dt, sp) {
    const p = c.path && c.path[0];
    let tx = p ? p[0] : c.tx;
    let ty = p ? p[1] : c.ty;
    const dx = tx - c.x;
    const dy = ty - c.y;
    const d = Math.hypot(dx, dy);
    c.ph += dt * 12;
    if (d < 1.2) {
        c.x = tx;
        c.y = ty;
        if (p) {
            c.path.shift();
            return false;
        }
        return true;
    }
    const s = Math.min(d, sp * dt);
    c.x += dx / d * s;
    c.y += dy / d * s;
    return false;
}
// Free the activity spot a character is using
const rel = c => {
    if (c.act) {
        A[c.act].o[c.sp] = null;
        c.act = null;
    }
};
// D = items dropped on the ground, P = small particles (sparkles, water drops, petals...)
const D = [];
const P = [];
const sp = (x, y, c, vy = -10, t = .8, gr = 0) => P.push({ x, y, vx: rnd(-6, 6), vy, t, m: t, c, g: gr });
// Drop whatever the character is holding onto the ground
function drop(c) {
    if (c.item) {
        D.push({ x: c.x + rnd(-3, 3), y: c.y, it: c.item, t: 9 });
        c.item = null;
    }
}
// A free student picks what to do next: pick up a dropped item, stroll, or join a weighted-random activity with a free spot
function choose(c) {
    if (D.length && Math.random() < .4) {
        const d = D[0];
        c.pk = d;
        setT(c, d.x, d.y, 'pick');
        return;
    }
    if (Math.random() < .2) {
        setT(c, rnd(20, 300), rnd(92, 102), 'idle');
        c.w = rnd(2, 5);
        return;
    }
    let ks = Object.keys(A).filter(k => A[k].o.includes(null));
    if (ks.length > 1) {
        ks = ks.filter(k => k !== c.last);
    }
    let tot = 0;
    ks.forEach(k => tot += A[k].w);
    let r = Math.random() * tot;
    let k = ks[0];
    for (const q of ks) {
        r -= A[q].w;
        if (r <= 0) {
            k = q;
            break;
        }
    }
    const fr = [];
    A[k].o.forEach((o, i) => {
        if (!o) {
            fr.push(i);
        }
    });
    const i = pick(fr);
    A[k].o[i] = c;
    c.act = k;
    c.sp = i;
    c.last = k;
    c.item = A[k].it;
    if (k === 'garden' && Math.random() < .6) {
        setT(c, 108, 138, 'fill');
    }
    else {
        setT(c, A[k].s[i][0], A[k].s[i][1], 'act');
    }
}
// Called when a character finishes walking: decide what state they enter next
function arrive(c) {
    if (c.then === 'fill') {
        for (let i = 0; i < 6; i++) {
            sp(c.x + 3, c.y - 5, '#4aa3ff', -12, .5, 30);
        }
        const s = A[c.act].s[c.sp];
        setT(c, s[0], s[1], 'act');
    }
    else if (c.then === 'act' && !c.tc) {
        c.s = 'act';
        c.w = rnd(...A[c.act].d);
        c.ec = rnd(6, 14);
    }
    else if (c.then === 'post') {
        c.s = 'act';
        c.w = rnd(8, 16);
        c.ec = rnd(6, 14);
    }
    else if (c.then === 'watch') {
        c.s = 'watch';
        c.w = ev ? Math.max(1, ev.d - ev.t) : 2;
    }
    else if (c.then === 'pick') {
        const k = D.indexOf(c.pk);
        if (k >= 0) {
            D.splice(k, 1);
        }
        c.pk = null;
        c.s = 'idle';
        c.w = 1;
    }
    else if (c.then === 'prank') {
        setEm(c, 'smile', 1.6);
        if (c.pv) {
            setEm(c.pv, 'excl', 1.4);
        }
        c.pv = null;
        c.s = 'idle';
        c.w = rnd(2, 4);
        const d = cs[1];
        if (d.s === 'idle' || d.s === 'act') {
            rel(d);
            d.item = null;
            setT(d, c.x - 6, c.y + 1, 'idle');
            d.w = rnd(2, 4);
        }
    }
    else {
        c.s = 'idle';
    }
}
// Per-frame update for one character. States:
//  idle (waiting) | go (walking) | act (doing an activity) | watch (watching an event)
//  freeze (scared) | flee (running off screen) | away (off screen, waiting to come back)
function updC(c, dt) {
    if (c.em) {
        c.em.t -= dt;
        if (c.em.t <= 0) {
            c.em = null;
        }
    }
    if (c.s === 'away') {
        if (mode === 'calm' && T >= c.ret) {
            c.s = 'go';
            c.x = c.ex;
            c.y = c.ey;
            setT(c, rnd(148, 172), rnd(95, 101), 'idle');
            c.via = null;
            c.w = rnd(.5, 2);
        }
        return;
    }
    if (c.s === 'flee') {
        if (mv(c, dt, 52)) {
            c.s = 'away';
            c.ret = 1e9;
            c.em = null;
        }
        else if (Math.random() < dt * .6) {
            setEm(c, pick(['excl', 'sweat']), 1);
        }
        return;
    }
    if (c.s === 'freeze') {
        c.jx = Math.sin(T * 55 + c.id * 3) * .7;
        c.ec -= dt;
        if (c.ec <= 0) {
            c.ec = rnd(1.8, 3);
            setEm(c, pick(['excl', 'question', 'sweat']), 1.2);
        }
        return;
    }
    if (c.s === 'watch') {
        c.w -= dt;
        if (c.w <= 0) {
            c.s = 'idle';
            c.w = rnd(1, 3);
        }
        return;
    }
    if (c.s === 'go') {
        if (mv(c, dt, c.tc ? 14 : 17)) {
            arrive(c);
        }
        return;
    }
    if (c.s === 'idle') {
        c.w -= dt;
        if (c.w <= 0) {
            if (c.tc) {
                const h = c.hm || pick(WP);
                setT(c, h[0], h[1], 'post');
            }
            else {
                choose(c);
            }
        }
        return;
    }
    if (c.s === 'act') {
        c.w -= dt;
        c.ec -= dt;
        if (c.ec <= 0) {
            c.ec = rnd(10, 22);
            setEm(c, c.tc ? pick(TEM[c.tn]) : pick(A[c.act].em));
        }
        if (c.tc) {
            if (c.w <= 0) {
                const p = pick(WP);
                setT(c, p[0], p[1], 'idle');
                c.w = rnd(3, 6);
            }
            return;
        }
        const k = c.act;
        const x = c.x;
        const y = c.y;
        if (k === 'garden') {
            plants[c.sp % 6].g = Math.min(1, plants[c.sp % 6].g + dt * .06);
            if (Math.random() < dt * 5) {
                sp(x + 4, y - 3, '#4aa3ff', 14, .5, 40);
            }
        }
        else if (k === 'magic') {
            mg++;
            if (Math.random() < dt * 6) {
                sp(x, y - 8, pick(['#b68cff', '#6ef', '#fff']), rnd(-18, -8), .9);
            }
        }
        else if (k === 'deco') {
            deco += dt * .12;
            if (Math.random() < dt * 3) {
                sp(x + 3, y - 5, '#ffe066', -6, .4);
            }
        }
        else if (k === 'pond') {
            if (Math.random() < dt * 3) {
                sp(x + rnd(-4, 4), y, '#e0b070', 8, .6, 30);
            }
        }
        if (c.w <= 0) {
            rel(c);
            c.item = null;
            c.s = 'idle';
            c.w = rnd(1, 3);
        }
    }
}
// ---- NOISE + MODES ('calm' | 'warn' | 'flee') ----
// lvl = smoothed noise level 0-100, T = game clock in seconds, quietT = seconds since last noise
let mode = 'calm';
let T = 0;
let lvl = 0;
let calmT = 0;
let quietT = 0;
let evT = 0;
let nextEv = 18;
let ev = null;
let an;
let buf;
let micOn = false;
let mg = 0;
let deco = 2;
let sim = { s: 0, w: 0, tl: 0, tw: 0 };
const sl = $('sl');
// Current loudness 0-100: microphone volume, or the test keys / buttons
function raw() {
    let v = 0;
    if (micOn) {
        an.getFloatTimeDomainData(buf);
        let s = 0;
        for (const x of buf) {
            s += x * x;
        }
        v = Math.min(100, Math.sqrt(s / buf.length) * 350);
    }
    const th = +sl.value;
    return Math.max(v, sim.s || sim.tl ? 100 : 0, sim.w || sim.tw ? th * .82 : 0);
}
$('mic').onclick = async () => {
    try {
        const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        ac.resume();
        an = ac.createAnalyser();
        an.fftSize = 1024;
        ac.createMediaStreamSource(s).connect(an);
        buf = new Float32Array(an.fftSize);
        micOn = true;
        $('mic').textContent = 'MIC ON';
    }
    catch (e) {
        $('mic').textContent = 'NO MIC: USE TEST KEYS';
    }
};
addEventListener('keydown', e => {
    if (e.code === 'Space') {
        sim.s = 1;
        e.preventDefault();
    }
    if (e.key === 'w') {
        sim.w = 1;
    }
    if (e.key === 'e' && mode === 'calm' && !ev) {
        startEv(pick(Object.keys(EVT)));
    }

    else if (lvl >= th * .7) {
        if (mode !== 'warn') {
            mode = 'warn';
            onWarn();
        }
        calmT = 0;
        quietT = 0;
        evT = 0;
    }
    else if (mode === 'warn') {
        calmT += dt;
        if (calmT > 1.5) {
            mode = 'calm';
            onCalm();
        }
    }
    const away = cs.filter(c => c.s === 'away' || c.s === 'flee').length;
    if (mode === 'calm') {
        quietT += dt;
        if (!away && !ev) {
            evT += dt;
            if (evT >= nextEv) {
                startEv(pick(Object.keys(EVT)));
            }
        }
    }
    cs.forEach(c => updC(c, dt));
    prankTimer(dt);
    if (ev) {
        evUp(dt);
    }
    if (Math.random() < dt * .3 && mode === 'calm') {
        const p = cs.filter(c => c.s === 'idle' || c.s === 'act' || c.s === 'go');
        const a = pick(p);
        const b = p.find(o => o !== a && Math.hypot(o.x - a.x, o.y - a.y) < 18);
        if (b && !a.em && !b.em) {
            const i = pick(['heart', 'smile', 'note', 'star']);
            setEm(a, i, 1.6);
            setEm(b, i, 1.6);
        }
    }
    draw();
    let t = '';
    let c = '';
    if (mode === 'flee') {
        t = 'TOO LOUD.<br>EVERYONE IS RUNNING AWAY!';
        c = 'flee';
    }
    else if (mode === 'warn') {
        t = 'NOISE WARNING!<br><small>Shh... please be quiet</small>';
        c = 'warn';
    }
    else if (away) {
        t = `Quiet now... everyone is coming back (${44 - away}/44)`;
        c = 'ok';
    }
    else if (ev) {
        t = ev.txt;
        c = 'ev';
    }
    if (t !== bt || c !== bc) {
        bt = t;
        bc = c;
        $('bn').innerHTML = t;
        $('bn').className = c;
    }
    $('lv').style.width = Math.min(100, lvl) + '%';
    $('mk').style.left = th + '%';
    $('wk').style.left = th * .7 + '%';
    const s = `Quiet ${Math.floor(quietT)}s  At school ${44 - away}/44`;
    if (s !== inf) {
        inf = s;
        $('info').textContent = s;
    }
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script></body></html>
