<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Little Wizard School</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe6f2;--fg:#1b2030;--bar:#c9d2e6;--ac:#6a4cff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141f;--fg:#e8ecf7;--bar:#1c2033;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141f;--fg:#e8ecf7;--bar:#1c2033;color-scheme:dark}
html{height:100%}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:9px 'Press Start 2P',ui-monospace,Menlo,Consolas,monospace}
#bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:var(--bar)}
button{font:inherit;background:var(--ac);color:#fff;border:0;padding:6px 8px;cursor:pointer}
#meter{position:relative;width:150px;height:12px;background:#0006;border:2px solid var(--fg)}
#lv{display:block;height:100%;width:0;background:linear-gradient(90deg,#4c4,#fd3 70%,#e43)}
#meter b{position:absolute;top:-3px;width:2px;height:18px}#mk{background:#f33}#wk{background:#fc0}
input{vertical-align:middle}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#stage{position:relative;width:min(100%,calc((100vh - 60px)*1.6));aspect-ratio:8/5;max-height:100%}
#c{display:block;width:100%;height:100%;image-rendering:pixelated;background:#5aa14a}
#nm{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bn{position:absolute;top:4%;left:50%;transform:translateX(-50%);max-width:90%;text-align:center;line-height:1.6;padding:10px 14px;border:3px solid #fff;font-size:clamp(8px,2vw,20px);display:none;color:#fff}
#bn.warn{display:block;background:#c98a00;animation:p .5s infinite alternate}
#bn.flee{display:block;background:#b01818;animation:p .25s infinite alternate}
#bn.ok{display:block;background:#2a6fb0;font-size:clamp(7px,1.5vw,14px)}
#bn.ev{display:block;background:#6a3fb5;font-size:clamp(7px,1.7vw,16px)}
#bn small{font-size:.6em}@keyframes p{to{transform:translateX(-50%) scale(1.05)}}

[hidden]{display:none!important}
#modal{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.65)}
#modal .card{width:100%;max-width:760px;max-height:90vh;overflow:auto;padding:14px 16px;line-height:1.6;background:var(--bar);color:var(--fg);border:3px solid var(--fg)}
#modal h2{font-size:13px;margin:0 0 4px}#modal h3{font-size:10px;margin:14px 0 6px}#modal p{font-size:8px;margin:0 0 6px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.opt{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:6px 8px;border:2px solid rgba(0,0,0,.25);cursor:pointer;font-size:8px}
.opt small{flex-basis:100%;padding-left:22px;font-size:7px;opacity:.75}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button.alt{background:transparent;color:var(--fg);border:2px solid var(--fg)}
</style>
</head>
<body>
<div id="bar"><button id="mic">ENABLE MIC</button><div id="meter"><i id="lv"></i><b id="wk"></b><b id="mk"></b></div>
<label>Limit <input id="sl" type="range" min="5" max="90" value="40"></label><span id="info"></span>
<button id="tw">Test warn</button><button id="tl">Test loud</button><button id="cfgBtn" class="alt">Settings</button></div>
<div id="wrap"><div id="stage"><canvas id="c"></canvas><canvas id="nm"></canvas></div><div id="bn"></div></div>
<div id="modal" hidden><div class="card" role="dialog" aria-label="Settings">
<h2>Settings</h2><p>Choose which stories and holidays appear. Saved on this computer.</p>
<h3>Book series (their characters visit and leave props around the school)</h3>
<div class="row" style="margin:0 0 6px"><button id="cfgAll" class="alt">Select all</button><button id="cfgNone" class="alt">Clear</button></div>
<div id="seriesList" class="grid"></div>
<h3>School holidays (costumes, decorations, weather and special events)</h3>
<div id="holList" class="grid"></div>
<div class="row"><button id="cfgSave">Save</button><button id="cfgCancel" class="alt">Cancel</button></div>
</div></div>
<script>

/*
 * LITTLE WIZARD SCHOOL - a quiet-class idle game
 * ---------------------------------------------
 * The microphone level decides what happens:
 *   calm   -> students go about school life (and special events pop up)
 *   warn   -> level near the limit: everyone freezes and drops what they hold
 *   flee   -> level above the limit: everyone runs off screen, then returns slowly
 * Layout of this file: helpers, activities, characters, noise/modes, events,
 * world + pathfinding, scenery, Horrible Harry extras, drawing, main loop.
 */
// ---- Canvas setup: the game is drawn at 320x200 and scaled up by CSS for the pixel look ----
const WIDTH = 320;
const HEIGHT = 200;
const byId = i => document.getElementById(i);
const canvas = byId('c');
canvas.width = WIDTH;
canvas.height = HEIGHT;
let ctx = canvas.getContext('2d');
const backgroundCanvas = document.createElement('canvas');
backgroundCanvas.width = WIDTH;
backgroundCanvas.height = HEIGHT;
let ol = 0;
// R = draw a filled rectangle. While 'ol' is on it draws a dark 1px-bigger rectangle instead,
// which is how outlines work (see OL below).
const drawRect = (x, y, w, h, c) => {
    if (ol) {
        ctx.fillStyle = '#1b1228';
        ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, w + 2, h + 2);
        return;
    }
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
};
// ob = draw a 1px outline around a rectangle
const drawRectOutline = (x, y, w, h, c = '#2a1a14') => {
    drawRect(x - 1, y - 1, w + 2, 1, c);
    drawRect(x - 1, y + h, w + 2, 1, c);
    drawRect(x - 1, y, 1, h, c);
    drawRect(x + w, y, 1, h, c);
};
// OL(fn) = run a drawing function twice: first as a dark silhouette, then in colour => outlined sprite
const drawOutlined = f => {
    ol = 1;
    f();
    ol = 0;
    f();
};
const randomBetween = (a, b) => a + Math.random() * (b - a);
const pickOne = a => a[Math.random() * a.length | 0];
// E = draw a filled ellipse (used for shadows, ponds, canopies). Skipped during outline pass.
function fillEllipse(cx, cy, rx, ry, c) {
    if (ol) {
        return;
    }
    ctx.fillStyle = c;
    for (let y = -ry; y <= ry; y++) {
        const w = Math.sqrt(1 - y * y / (ry * ry)) * rx;
        ctx.fillRect(Math.round(cx - w), Math.round(cy + y), Math.round(w * 2), 1);
    }
}
// ---- Tiny pixel emoji: each icon is 7x7 characters, letters map to the colours in PAL ----
const PIXEL_COLORS = { r: '#e33', y: '#fd3', b: '#39f', w: '#fff', k: '#222', p: '#f6a', g: '#3a3', o: '#e92', c: '#6ef', u: '#85f' };
const EMOJI_ICONS = {
    heart: ['.......', '.rr.rr.', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'],
    star: ['...y...', '...y...', 'yyyyyyy', '.yyyyy.', '..yyy..', '.yy.yy.', '.y...y.'],
    note: ['..bbbbb', '..b...b', '..b...b', '..b...b', 'bbb.bbb', 'bbb.bbb', '.......'],
    smile: ['.yyyyy.', 'yyyyyyy', 'ykyyyky', 'yyyyyyy', 'ykyyyky', 'yykkkyy', '.yyyyy.'],
    sparkle: ['...w...', '.w.c.w.', '..ccc..', 'wcccccw', '..ccc..', '.w.c.w.', '...w...'],
    question: ['.uuuuu.', 'u.....u', '......u', '...uuu.', '...u...', '.......', '...u...'],
    excl: ['...r...', '...r...', '...r...', '...r...', '...r...', '.......', '...r...'],
    sweat: ['...b...', '..bbb..', '.bbbbb.', '.bbwbb.', '..bbb..', '.......', '.......'],
    book: ['.......', 'rrr.ooo', 'rrr.ooo', 'rrr.ooo', 'rrr.ooo', 'rrr.ooo', '.......'],
    flower: ['..ppp..', '.ppypp.', '..ppp..', '...g...', '..gg...', '...g...', '.......']
};
// Items characters carry: [colour, width, height, highlight colour]
const ITEM_SPRITES = { can: ['#4aa3ff', 3, 2, '#bfe0ff'], book: ['#c33', 3, 3, '#fff'], wand: ['#8b5a2b', 1, 4, '#ffe066'], poster: ['#ff7ab8', 3, 3, '#fff'], mask: ['#fff', 3, 3, '#222'], bread: ['#e0b070', 2, 2, '#fff'] };
const item = (k, x, y) => {
    const t = ITEM_SPRITES[k];
    drawRect(x, y, t[1], t[2], t[0]);
    drawRect(x + (t[1] > 2 ? 1 : 0), y, 1, 1, t[3]);
};
// Draws a speech bubble with an emoji inside
function bubble(x, y, n) {
    drawRect(x - 1, y - 1, 9, 9, '#222');
    drawRect(x, y, 7, 7, '#fff');
    drawRect(x + 2, y + 8, 3, 1, '#222');
    drawRect(x + 3, y + 9, 1, 1, '#222');
    const a = EMOJI_ICONS[n];
    for (let j = 0; j < 7; j++) {
        for (let i = 0; i < 7; i++) {
            const ch = a[j][i];
            if (ch !== '.') {
                drawRect(x + i, y + j, 1, 1, PIXEL_COLORS[ch]);
            }
        }
    }
}
/* ---------- activities ---------- */
// ---- ACTIVITIES ----
// Each activity has: w = how likely students pick it, it = item carried, em = emoji they may show,
// d = [min,max] seconds, sit = students sit down, s = list of [x,y] spots (one student per spot),
// o = who occupies each spot (filled in below)
const ACTIVITIES = {
    garden: { w: 3, it: 'can', em: ['flower', 'smile', 'heart'], d: [14, 30], s: [[36, 135], [63, 135], [90, 135], [36, 159], [63, 159], [90, 159], [18, 131], [106, 150]] },
    class: { w: 2, it: 'book', em: ['book', 'question', 'star'], d: [16, 34], sit: 1, s: [[41, 57], [65, 57], [89, 57], [113, 57], [41, 75], [65, 75], [89, 75], [113, 75]] },
    lesson: { w: 2, it: 'book', em: ['book', 'smile', 'question'], d: [16, 34], sit: 1, s: [[150, 138], [165, 138], [180, 138], [195, 138], [150, 150], [165, 150], [180, 150], [195, 150]] },
    theater: { w: 3, it: 'mask', em: ['note', 'star', 'smile'], d: [14, 28], s: [[215, 50], [235, 44], [255, 50], [275, 44], [290, 52], [225, 76], [255, 78], [280, 76]] },
    deco: { w: 2, it: 'poster', em: ['star', 'heart', 'smile'], d: [10, 22], s: [[26, 40], [124, 40], [26, 64], [124, 64], [112, 34]] },
    magic: { w: 3, it: 'wand', em: ['sparkle', 'star', 'excl'], d: [12, 26], s: [[143, 52], [187, 52], [152, 72], [178, 72], [165, 38], [140, 66]] },
    pond: { w: 2, it: 'bread', em: ['heart', 'smile', 'note'], d: [10, 22], s: [[232, 140], [265, 160], [298, 140], [265, 120]] },
    read: { w: 2, it: 'book', em: ['book', 'smile', 'heart'], d: [14, 30], sit: 1, s: [[206, 121], [220, 121], [213, 128], [227, 128]] },
    ball: { w: 2, it: null, em: ['smile', 'star', 'note'], d: [12, 26], s: [[128, 181], [152, 186], [176, 181], [200, 186]] }
};
for (const k in ACTIVITIES) {
    ACTIVITIES[k].o = ACTIVITIES[k].s.map(() => null);
}
// Waypoints teachers patrol between, and the post each teacher stands at (null = roams)
const PATROL_POINTS = [[40, 100], [100, 160], [160, 98], [225, 100], [268, 100], [150, 176], [60, 100], [140, 66]];
const TEACHER_POSTS = [[75, 37], [172, 128], [205, 70], null];
const TEACHER_EMOJIS = [['book', 'excl', 'smile'], ['book', 'star', 'smile'], ['note', 'star', 'smile'], ['smile', 'flower', 'book']];
// Colour palettes for randomly generated students
const SKIN_TONES = ['#f6d2b0', '#e3a876', '#b9774a', '#7a4a2c'];
const HAIR_COLORS = ['#2b1b0e', '#6b3f1d', '#d9a441', '#c0392b', '#1a1a1a', '#e8e0d0', '#7b4bd1'];
const ROBE_COLORS = ['#c0392b', '#2e86de', '#27ae60', '#e1a400'];
const HAT_COLORS = ['#33264f', '#4a2c6e', '#1f3b66', '#7a2a3a'];
// ---- CHARACTERS: 40 students (cs[0..39]) followed by 4 teachers (cs[40..43]) ----
const people = [];
for (let i = 0; i < 44; i++) {
    const tc = i >= 40;
    const hm = tc ? TEACHER_POSTS[i - 40] : null;
    people.push({ id: i, tc, tn: i - 40, hm, x: hm ? hm[0] : randomBetween(20, 300), y: hm ? hm[1] : randomBetween(93, 99), tx: 0, ty: 0, s: tc ? 'act' : 'idle', w: randomBetween(0, 3), ph: randomBetween(0, 6), sk: pickOne(SKIN_TONES), hr: pickOne(HAIR_COLORS), hc: pickOne(HAT_COLORS), rb: tc ? ['#6a3fb5', '#1f7a8c', '#8c2f5e', '#a35a1f'][i - 40] : pickOne(ROBE_COLORS), ht: Math.random() < .5, em: null, item: null, act: null, sp: 0, last: null, then: 'idle', ex: 0, ey: 0, ret: 0, frz: 0, ec: randomBetween(1, 3), jx: 0 });
}
/* Special characters from the Horrible Harry books (names are drawn under their feet) */
Object.assign(people[0], { name: 'Harry', hr: '#111', ht: false, rb: '#1a1a24' });
Object.assign(people[1], { name: 'Doug', hr: '#6b3f1d', ht: false, rb: '#2e86de', gl: true });
Object.assign(people[2], { name: 'Song Lee', hr: '#111', ht: false, rb: '#ff7ab8' });
people[40].name = 'Miss Mackle';
// Show an emoji bubble above a character for t seconds
const showEmoji = (c, i, t = 1.8) => {
    c.em = { i, t, m: t };
};
// Send a character to (x,y). A route around walls is found first (see findPath), then 'then' says what to do on arrival
function sendTo(c, x, y, then) {
    // If the requested spot is inside a wall/object, move the target to the nearest walkable cell
    if (blocked[Math.floor(y / 4) * GRID_W + Math.floor(x / 4)]) {
        const [ci, cj] = cellOf(x, y);
        x = ci * 4 + 2;
        y = cj * 4 + 2;
    }
    c.tx = x;
    c.ty = y;
    c.then = then;
    c.s = 'go';
    c.path = findPath(c.x, c.y, x, y);
}
// Move one step along the planned route. Returns true when the final target is reached
function stepToward(c, dt, sp) {
    const p = c.path && c.path[0];
    let tx = p ? p[0] : c.tx;
    let ty = p ? p[1] : c.ty;
    const dx = tx - c.x;
    const dy = ty - c.y;
    const d = Math.hypot(dx, dy);
    c.ph += dt * 12;
    if (d < 1.2) {
        c.x = tx;
        c.y = ty;
        if (p) {
            c.path.shift();
            return false;
        }
        return true;
    }
    const s = Math.min(d, sp * dt);
    c.x += dx / d * s;
    c.y += dy / d * s;
    return false;
}
// Free the activity spot a character is using
const releaseSpot = c => {
    if (c.act) {
        ACTIVITIES[c.act].o[c.sp] = null;
        c.act = null;
    }
};
// D = items dropped on the ground, P = small particles (sparkles, water drops, petals...)
const droppedItems = [];
const particles = [];
const spawnParticle = (x, y, c, vy = -10, t = .8, gr = 0, s = 1) => particles.push({ x, y, vx: randomBetween(-6, 6), vy, t, m: t, c, g: gr, s });
// Drop whatever the character is holding onto the ground
function dropHeldItem(c) {
    if (c.item) {
        droppedItems.push({ x: c.x + randomBetween(-3, 3), y: c.y, it: c.item, t: 9 });
        c.item = null;
    }
}
// A free student picks what to do next: pick up a dropped item, stroll, or join a weighted-random activity with a free spot
function chooseNextActivity(c) {
    if (droppedItems.length && Math.random() < .4) {
        const d = droppedItems[0];
        c.pk = d;
        sendTo(c, d.x, d.y, 'pick');
        return;
    }
    if (Math.random() < .2) {
        sendTo(c, randomBetween(20, 300), randomBetween(92, 102), 'idle');
        c.w = randomBetween(2, 5);
        return;
    }
    let ks = Object.keys(ACTIVITIES).filter(k => ACTIVITIES[k].o.includes(null));
    if (ks.length > 1) {
        ks = ks.filter(k => k !== c.last);
    }
    let tot = 0;
    ks.forEach(k => tot += ACTIVITIES[k].w);
    let r = Math.random() * tot;
    let k = ks[0];
    for (const q of ks) {
        r -= ACTIVITIES[q].w;
        if (r <= 0) {
            k = q;
            break;
        }
    }
    const fr = [];
    ACTIVITIES[k].o.forEach((o, i) => {
        if (!o) {
            fr.push(i);
        }
    });
    const i = pickOne(fr);
    ACTIVITIES[k].o[i] = c;
    c.act = k;
    c.sp = i;
    c.last = k;
    c.item = ACTIVITIES[k].it;
    if (k === 'garden' && Math.random() < .6) {
        sendTo(c, 108, 138, 'fill');
    }
    else {
        sendTo(c, ACTIVITIES[k].s[i][0], ACTIVITIES[k].s[i][1], 'act');
    }
}
// Called when a character finishes walking: decide what state they enter next
function onArrive(c) {
    if (c.then === 'fill') {
        for (let i = 0; i < 6; i++) {
            spawnParticle(c.x + 3, c.y - 5, '#4aa3ff', -12, .5, 30);
        }
        const s = ACTIVITIES[c.act].s[c.sp];
        sendTo(c, s[0], s[1], 'act');
    }
    else if (c.then === 'act' && !c.tc) {
        c.s = 'act';
        c.w = randomBetween(...ACTIVITIES[c.act].d);
        c.ec = randomBetween(6, 14);
    }
    else if (c.then === 'post') {
        c.s = 'act';
        c.w = randomBetween(8, 16);
        c.ec = randomBetween(6, 14);
    }
    else if (c.then === 'stop') {
        beginVisitStop(c);
    }
    else if (c.then === 'watch') {
        c.s = 'watch';
        c.w = currentEvent ? Math.max(1, currentEvent.d - currentEvent.t) : 2;
    }
    else if (c.then === 'pick') {
        const k = droppedItems.indexOf(c.pk);
        if (k >= 0) {
            droppedItems.splice(k, 1);
        }
        c.pk = null;
        c.s = 'idle';
        c.w = 1;
    }
    else if (c.then === 'prank') {
        showEmoji(c, 'smile', 1.6);
        if (c.pv) {
            showEmoji(c.pv, 'excl', 1.4);
        }
        c.pv = null;
        c.s = 'idle';
        c.w = randomBetween(2, 4);
        const d = people[1];
        if (d.s === 'idle' || d.s === 'act') {
            releaseSpot(d);
            d.item = null;
            sendTo(d, c.x - 6, c.y + 1, 'idle');
            d.w = randomBetween(2, 4);
        }
    }
    else {
        c.s = 'idle';
    }
}
// Per-frame update for one character. States:
//  idle (waiting) | go (walking) | act (doing an activity) | watch (watching an event)
//  freeze (scared) | flee (running off screen) | away (off screen, waiting to come back)
function updateCharacter(c, dt) {
    if (c.guest && updateVisitor(c, dt)) {
        return;
    }
    if (c.em) {
        c.em.t -= dt;
        if (c.em.t <= 0) {
            c.em = null;
        }
    }
    if (c.s === 'away') {
        if (noiseMode === 'calm' && clock >= c.ret) {
            c.s = 'go';
            c.x = c.ex;
            c.y = c.ey;
            sendTo(c, randomBetween(148, 172), randomBetween(95, 101), 'idle');
            c.w = randomBetween(.5, 2);
        }
        return;
    }
    if (c.s === 'flee') {
        if (stepToward(c, dt, c.guest && noiseMode !== 'flee' ? 22 : 52)) {
            c.s = 'away';
            c.ret = 1e9;
            c.em = null;
        }
        else if (Math.random() < dt * .6) {
            showEmoji(c, pickOne(['excl', 'sweat']), 1);
        }
        return;
    }
    if (c.s === 'freeze') {
        c.jx = Math.sin(clock * 55 + c.id * 3) * .7;
        c.ec -= dt;
        if (c.ec <= 0) {
            c.ec = randomBetween(1.8, 3);
            showEmoji(c, pickOne(['excl', 'question', 'sweat']), 1.2);
        }
        return;
    }
    if (c.s === 'watch') {
        c.w -= dt;
        if (c.w <= 0) {
            c.s = 'idle';
            c.w = randomBetween(1, 3);
        }
        return;
    }
    if (c.s === 'go') {
        if (stepToward(c, dt, c.tc ? 14 : 17)) {
            onArrive(c);
        }
        return;
    }
    if (c.s === 'idle') {
        c.w -= dt;
        if (c.w <= 0) {
            if (c.tc) {
                const h = c.hm || pickOne(PATROL_POINTS);
                sendTo(c, h[0], h[1], 'post');
            }
            else {
                chooseNextActivity(c);
            }
        }
        return;
    }
    if (c.s === 'act') {
        c.w -= dt;
        c.ec -= dt;
        if (c.ec <= 0) {
            c.ec = randomBetween(10, 22);
            showEmoji(c, c.tc ? pickOne(TEACHER_EMOJIS[c.tn]) : pickOne(ACTIVITIES[c.act].em));
        }
        if (c.tc) {
            if (c.w <= 0) {
                const p = pickOne(PATROL_POINTS);
                sendTo(c, p[0], p[1], 'idle');
                c.w = randomBetween(3, 6);
            }
            return;
        }
        const k = c.act;
        const x = c.x;
        const y = c.y;
        if (k === 'garden') {
            plants[c.sp % 6].g = Math.min(1, plants[c.sp % 6].g + dt * .06);

    c.grp = group; c.si = 0; c.off = [[0, 0], [-9, 3], [9, 3]][i];

function createVisitor(spec, series) {

    then: 'stop', ex: 0, ey: 0, ret: 0, frz: 0, ec: 0, jx: 0, hid: false, cos: null };
  Object.assign(c, spec.kid || {});

}
// A visit is a short list of stops: the series' favourite place, greeting a student, joining an activity...
function planVisitStops(members) {
  const stops = [];
  new Set(members.map(m => m[0])).forEach(s => stops.push({ k: 'prop', pt: s.place, act: s.place[2], dur: randomBetween(5, 8) }));
  stops.push({ k: 'kid', dur: randomBetween(3, 5) });
  const place = pickOne(VISITOR_PLACES);
  stops.push({ k: 'place', pt: place.pt, act: place.act, dur: randomBetween(4, 6) });
  if (Math.random() < .6) stops.push({ k: 'kid', dur: randomBetween(3, 5) });
  return shuffle(stops);
}
function stopLocation(st) {
  if (st.k === 'kid') {
    if (!st.who || st.who.s === 'away') st.who = pickOne(residentsOnScreen());
    return st.who ? [st.who.x + 8, st.who.y] : [160, 98];
  }
  return st.pt;
}
function goToNextStop(c) {
  const st = c.grp.stops[c.si++];
  if (!st) return sendVisitorHome(c);
  const pt = stopLocation(st);
  c.cur = st;
  sendTo(c, pt[0] + c.off[0], pt[1] + c.off[1], 'stop');
}
function beginVisitStop(c) { c.s = 'gdo'; c.w = c.cur.dur; c.ec = 0; c.hid = c.cur.act === 'climb'; }
function sendVisitorHome(c) {            // walk to the nearest screen edge (same route logic as running away, but calmly)
  const pp = routeToNearestEdge(c.x, c.y), L = pp.length ? pp[pp.length - 1] : [c.x, c.y];
  c.hid = false; c.s = 'flee'; c.path = pp;
  c.tx = L[0] < 4 ? -14 : L[0] > WIDTH - 4 ? WIDTH + 14 : L[0];
  c.ty = L[1] < 4 ? -16 : L[1] > HEIGHT - 4 ? HEIGHT + 16 : L[1];
}
// Called first from updC. Returns true when the visitor logic handled this frame.
function updateVisitor(c, dt) {
  if (c.s === 'idle') { c.si = Math.max(0, c.si - 1); goToNextStop(c); return true; }   // calmed down after a scare: resume
  if (c.s !== 'gdo') return false;
  c.w -= dt; c.ec -= dt;
  if (c.ec <= 0) { c.ec = randomBetween(1.4, 2.4); visitorAction(c); }
  if (c.w <= 0) { c.hid = false; goToNextStop(c); }
  return true;
}
function visitorAction(c) {
  const st = c.cur, ser = c.series;
  showEmoji(c, pickOne(ser.emo), 1.4);
  spawnParticle(c.x + randomBetween(-4, 4), c.y - 10, ser.col, -12, .9);
  if (st.k === 'kid' && st.who) showEmoji(st.who, pickOne(['heart', 'smile', 'star', 'note']), 1.5);
  if (st.act === 'water') plants.forEach(p => { p.g = Math.min(1, p.g + .08); });
  if (st.act === 'feed') spawnParticle(c.x + 3, c.y - 3, '#e0b070', 8, .6, 30);
  if (st.act === 'climb') for (let i = 0; i < 6; i++) spawnParticle(306 + randomBetween(-6, 6), 84, '#ffe066', randomBetween(-25, -8), .8);
  if (st.act === 'magic') spawnParticle(165 + randomBetween(-8, 8), 56, '#b68cff', -14, .8);
  if (st.act === 'stage') showEmoji(c, 'note', 1.4);
}

// ---- WALKING GRID: the map is split into 4px cells. BK = blocked cells (walls, desks, pond...), CS = path cost ----
const GRID_W = 80;
const GRID_H = 50;
const blocked = new Uint8Array(GRID_W * GRID_H);
const stepCost = new Float32Array(GRID_W * GRID_H).fill(1);
const edgeDistance = new Int16Array(GRID_W * GRID_H).fill(-1);
const forCells = (x, y, w, h, f) => {
    for (let j = Math.floor(y / 4); j <= Math.floor((y + h - .1) / 4); j++) {
        for (let i = Math.floor(x / 4); i <= Math.floor((x + w - .1) / 4); i++) {
            if (i >= 0 && j >= 0 && i < GRID_W && j < GRID_H) {
                f(j * GRID_W + i);
            }
        }
    }
};
const blockRect = (x, y, w, h) => forCells(x, y, w, h, m => blocked[m] = 1);
const setStepCost = (x, y, w, h, v) => forCells(x, y, w, h, m => stepCost[m] = v);
// Mark every solid object on the map as blocked so characters walk around them
function buildWalkGrid() {

    blockRect(18, 82, 52, 8);
    blockRect(88, 82, 44, 8);
    [34, 58, 82, 106].forEach(x => [44, 62].forEach(y => blockRect(x, y, 14, 6)));
    blockRect(196, 10, 108, 20);
    blockRect(198, 12, 8, 50);
    blockRect(294, 12, 8, 50);

    [25, 52, 79].forEach(x => [116, 140].forEach(y => blockRect(x, y, 22, 14)));
    blockRect(104, 121, 8, 11);
    blockRect(12, 108, 46, 3);
    blockRect(82, 108, 34, 3);
    blockRect(12, 170, 104, 3);
    blockRect(12, 108, 3, 65);
    blockRect(112, 108, 3, 65);
    blockRect(159, 104, 26, 14);
    TREES.forEach(t => blockRect(t[0] - 2, t[1] - 6, 5, 7));
    for (let j = 0; j < GRID_H; j++) {
        for (let i = 0; i < GRID_W; i++) {
            const x = i * 4 + 2;
            const y = j * 4 + 2;
            if (((x - 265) / 28) ** 2 + ((y - 140) / 15) ** 2 < 1) {
                blocked[j * GRID_W + i] = 1;
            }
        }
    }
}
const clamp = (v, m) => Math.max(0, Math.min(m - 1, v));
// Find the nearest walkable cell to (i,j)
function nearestFreeCell(i, j) {
    for (let r = 0; r < 8; r++) {
        for (let dj = -r; dj <= r; dj++) {
            for (let di = -r; di <= r; di++) {
                if (Math.max(Math.abs(di), Math.abs(dj)) !== r) {
                    continue;
                }
                const a = i + di;
                const b = j + dj;
                if (a >= 0 && b >= 0 && a < GRID_W && b < GRID_H && !blocked[b * GRID_W + a]) {
                    return [a, b];
                }
            }
        }
    }
    return [i, j];
}
const cellOf = (x, y) => nearestFreeCell(clamp(Math.floor(x / 4), GRID_W), clamp(Math.floor(y / 4), GRID_H));
// Line-of-sight test: can we walk in a straight line from A to B without touching a blocked cell?
function hasLineOfSight(ax, ay, bx, by) {
    const d = Math.hypot(bx - ax, by - ay) || 1;
    const n = Math.ceil(d / 2);
    const nx = -(by - ay) / d;
    const ny = (bx - ax) / d;
    for (let k = 0; k <= n; k++) {
        const x = ax + (bx - ax) * k / n;
        const y = ay + (by - ay) * k / n;
        for (const o of [-2, 0, 2]) {
            const i = Math.floor((x + nx * o) / 4);
            const j = Math.floor((y + ny * o) / 4);
            if (i < 0 || j < 0 || i >= GRID_W || j >= GRID_H || blocked[j * GRID_W + i]) {
                return false;
            }

// Remove unnecessary zig-zags from a route using line-of-sight
function smoothPath(px, py, pts) {

    while (i < pts.length) {
        let j = pts.length - 1;
        while (j > i && !hasLineOfSight(px, py, pts[j][0], pts[j][1])) {
            j--;
        }
        out.push(pts[j]);
        px = pts[j][0];
        py = pts[j][1];
        i = j + 1;
    }
    return out;
}
// A* pathfinding from (sx,sy) to (ex,ey) over the grid. Returns a list of waypoints
function findPath(sx, sy, ex, ey) {
    const [a, b] = cellOf(sx, sy);
    const [gc, gd] = cellOf(ex, ey);
    const S = b * GRID_W + a;
    const G = gd * GRID_W + gc;
    const gs = new Float32Array(GRID_W * GRID_H).fill(1e9);
    const fr = new Int32Array(GRID_W * GRID_H).fill(-1);
    const cd = new Uint8Array(GRID_W * GRID_H);
    const open = [S];
    gs[S] = 0;
    while (open.length) {
        let bi = 0;
        let bf = 1e9;
        for (let k = 0; k < open.length; k++) {
            const q = open[k];
            const f = gs[q] + Math.hypot(q % GRID_W - gc, ((q / GRID_W) | 0) - gd);
            if (f < bf) {
                bf = f;
                bi = k;
            }
        }
        const n = open.splice(bi, 1)[0];
        if (n === G) {
            break;
        }
        cd[n] = 1;
        const ni = n % GRID_W;
        const nj = (n / GRID_W) | 0;
        for (let dj = -1; dj <= 1; dj++) {
            for (let di = -1; di <= 1; di++) {
                if (!di && !dj) {
                    continue;
                }
                const i = ni + di;
                const j = nj + dj;
                if (i < 0 || j < 0 || i >= GRID_W || j >= GRID_H) {
                    continue;
                }
                const m = j * GRID_W + i;
                if (blocked[m] || cd[m]) {
                    continue;
                }
                if (di && dj && (blocked[nj * GRID_W + i] || blocked[j * GRID_W + ni])) {
                    continue;
                }
                const t = gs[n] + (di && dj ? 1.41 : 1) * stepCost[m];
                if (t < gs[m]) {
                    if (gs[m] >= 1e9) {
                        open.push(m);
                    }
                    gs[m] = t;
                    fr[m] = n;
                }
            }
        }
    }
    if (S !== G && fr[G] < 0) {
        return [[ex, ey]];
    }
    const pts = [];
    for (let q = G; q !== S && q >= 0; q = fr[q]) {
        pts.push([(q % GRID_W) * 4 + 2, ((q / GRID_W) | 0) * 4 + 2]);
    }
    pts.reverse();
    pts.push([ex, ey]);
    return smoothPath(sx, sy, pts);
}
// Precompute, for every cell, the distance to the nearest screen edge (used for fleeing)
function buildEdgeDistanceMap() {
    const q = [];
    for (let j = 0; j < GRID_H; j++) {
        for (let i = 0; i < GRID_W; i++) {
            if ((!i || !j || i === GRID_W - 1 || j === GRID_H - 1) && !blocked[j * GRID_W + i]) {
                edgeDistance[j * GRID_W + i] = 0;
                q.push(j * GRID_W + i);
            }
        }
    }
    for (let h = 0; h < q.length; h++) {
        const n = q[h];
        const ni = n % GRID_W;
        const nj = (n / GRID_W) | 0;
        for (let dj = -1; dj <= 1; dj++) {
            for (let di = -1; di <= 1; di++) {
                const i = ni + di;
                const j = nj + dj;
                if (i < 0 || j < 0 || i >= GRID_W || j >= GRID_H) {
                    continue;
                }
                const m = j * GRID_W + i;
                if (blocked[m] || edgeDistance[m] >= 0) {
                    continue;
                }
                if (di && dj && (blocked[nj * GRID_W + i] || blocked[j * GRID_W + ni])) {
                    continue;
                }
                edgeDistance[m] = edgeDistance[n] + 1;
                q.push(m);
            }
        }
    }
}
// Route to the nearest screen edge by following the distance map downhill
function routeToNearestEdge(x, y) {
    const [a, b] = cellOf(x, y);
    let n = b * GRID_W + a;
    const pts = [];
    for (let k = 0; k < 200 && edgeDistance[n] > 0; k++) {
        const ni = n % GRID_W;
        const nj = (n / GRID_W) | 0;
        let best = n;
        for (let dj = -1; dj <= 1; dj++) {
            for (let di = -1; di <= 1; di++) {
                const i = ni + di;
                const j = nj + dj;
                if (i < 0 || j < 0 || i >= GRID_W || j >= GRID_H) {
                    continue;
                }
                const m = j * GRID_W + i;
                if (blocked[m] || edgeDistance[m] < 0 || edgeDistance[m] >= edgeDistance[best]) {
                    continue;
                }
                if (di && dj && (blocked[nj * GRID_W + i] || blocked[j * GRID_W + ni])) {
                    continue;
                }
                best = m;
            }
        }
        if (best === n) {
            break;
        }
        n = best;
        pts.push([(n % GRID_W) * 4 + 2, ((n / GRID_W) | 0) * 4 + 2]);
    }
    return smoothPath(x, y, pts);
}

// Point at distance s along a polyline (used by the marching ants)
function pointAlongPath(r, s) {
    for (let i = 0; i < r.length - 1; i++) {
        const a = r[i];
        const b = r[i + 1];
        const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
        if (s <= d) {
            return [a[0] + (b[0] - a[0]) * s / d, a[1] + (b[1] - a[1]) * s / d];
        }
        s -= d;
    }
    return null;
}

    }
}
// One full frame: background, ground objects, characters sorted by height (so lower ones are in front), overlays
function drawFrame() {
    ctx.drawImage(backgroundCanvas, 0, 0);
    [[clock * 3, 50], [clock * 2 + 150, 140]].forEach(([x, y]) => fillEllipse(x % (WIDTH + 160) - 60, y, 45, 13, 'rgba(0,25,0,.09)'));
    drawMovingScenery();
    const L = [];
    people.forEach(c => {
        if (c.s !== 'away' && !c.hid) {
            L.push([c.y, () => drawCharacter(c)]);
        }
    });
    TREES.forEach(t => L.push([t[1], () => drawTree(t[0], t[1])]));
    L.push([90, drawClassroomFront]);
    L.sort((a, b) => a[0] - b[0]);
    L.forEach(o => o[1]());
    drawOverlay();
}
// ---- First-time setup: load saved settings, build the settings window, build the scenery ----
loadConfig();
buildSettingsUI();
applyConfig();

// ---- MAIN LOOP: update noise level, mode, events and characters, then draw and refresh the banner/meter ----
let lastFrameTime = performance.now();
let bannerText = '';
let bannerClass = '';
let infoText = '';
function gameLoop(now) {
    const dt = Math.min(.05, (now - lastFrameTime) / 1000);
    lastFrameTime = now;
    clock += dt;
    const r = readNoiseLevel();
    const th = +limitSlider.value;
    noiseLevel = r > noiseLevel ? r : Math.max(r, noiseLevel - 28 * dt);
    if (noiseLevel >= th) {
        if (noiseMode !== 'flee') {
            noiseMode = 'flee';
            onFlee();
        }
        calmTime = 0;
        quietTime = 0;
        eventTimer = 0;
    }
    else if (noiseMode === 'flee') {
        if (noiseLevel < th * .6) {
            calmTime += dt;
            if (calmTime > 3) {
                noiseMode = 'calm';
                quietTime = 0;
                eventTimer = 0;
                scheduleReturns();
            }
        }
        else {
            calmTime = 0;
        }
    }
    else if (noiseLevel >= th * .7) {
        if (noiseMode !== 'warn') {
            noiseMode = 'warn';
            onWarn();
        }
        calmTime = 0;
        quietTime = 0;
        eventTimer = 0;
    }
    else if (noiseMode === 'warn') {
        calmTime += dt;
        if (calmTime > 1.5) {
            noiseMode = 'calm';
            onCalm();
        }
    }
    const away = people.filter(c => !c.guest && (c.s === 'away' || c.s === 'flee')).length;
    if (noiseMode === 'calm') {
        quietTime += dt;
        if (!away && !currentEvent) {
            eventTimer += dt;
            if (eventTimer >= nextEventAt) {
                startEvent(chooseSpecialEvent());
            }
        }
    }
    people.forEach(c => updateCharacter(c, dt));
    prankTimer(dt);
    updateVisitorsAndWeather(dt);
    if (currentEvent) {
        updateEvent(dt);
    }
    if (Math.random() < dt * .3 && noiseMode === 'calm') {
        const p = people.filter(c => c.s === 'idle' || c.s === 'act' || c.s === 'go');
        const a = pickOne(p);
        const b = p.find(o => o !== a && Math.hypot(o.x - a.x, o.y - a.y) < 18);
        if (b && !a.em && !b.em) {
            const i = pickOne(['heart', 'smile', 'note', 'star']);
            showEmoji(a, i, 1.6);
            showEmoji(b, i, 1.6);
        }
    }
    drawFrame();
    let t = '';
    let c = '';
    if (noiseMode === 'flee') {
        t = 'TOO LOUD.<br>EVERYONE IS RUNNING AWAY!';
        c = 'flee';
    }
    else if (noiseMode === 'warn') {
        t = 'NOISE WARNING!<br><small>Shh... please be quiet</small>';
        c = 'warn';
    }
    else if (away) {
        t = `Quiet now... everyone is coming back (${44 - away}/44)`;
        c = 'ok';
    }
    else if (currentEvent) {
        t = currentEvent.txt;
        c = 'ev';
    }
    if (t !== bannerText || c !== bannerClass) {
        bannerText = t;
        bannerClass = c;
        byId('bn').innerHTML = t;
        byId('bn').className = c;
    }
    byId('lv').style.width = Math.min(100, noiseLevel) + '%';
    byId('mk').style.left = th + '%';
    byId('wk').style.left = th * .7 + '%';
    const s = `Quiet ${Math.floor(quietTime)}s  At school ${44 - away}/44`;
    if (s !== infoText) {
        infoText = s;
        byId('info').textContent = s;
    }
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);


</script>
